apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: products-service-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: products

  namespaceSelector:
    matchNames:
      - ecommerce

  endpoints:
    - port: http
      path: /metrics
      interval: 15s